<div class="map-card">
  <div class="map-header">
    <div class="header-titles">
      <h2 class="map-title">Regional Sensor Density & Anomaly Map</h2>
      <span class="map-subtitle">West-Central Sector</span>
    </div>
  </div>

  <div class="map-container">
    <div class="zone-legend-strip">
      <div class="legend-item zone-1">
        <span class="legend-color-dot"></span>
        <span class="legend-label">ZONE 1: WEST COASTAL</span>
      </div>
      <div class="legend-item zone-2">
        <span class="legend-color-dot"></span>
        <span class="legend-label">ZONE 2: NORTH ARID</span>
      </div>
      <div class="legend-item zone-3">
        <span class="legend-color-dot"></span>
        <span class="legend-label">ZONE 3: CENTRAL PLAINS</span>
      </div>
      <div class="legend-item zone-4">
        <span class="legend-color-dot"></span>
        <span class="legend-label">ZONE 4: WESTERN GHATS</span>
      </div>
    </div>

    <!-- Synoptic Mesh Map SVG -->
    <div class="svg-map-wrapper">
      <svg viewBox="0 0 520 500" class="synoptic-svg" preserveAspectRatio="xMidYMid meet">
        <!-- Background Grid Coordinates -->
        <defs>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="0.8" />
          </pattern>

          <!-- Zone Contours Gradients -->
          <radialGradient id="critGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ef4444" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <rect width="520" height="500" fill="#fafafa" />
        <rect width="520" height="500" fill="url(#grid)" />

        <!-- Sector Contour Boundaries -->
        <!-- Zone 1 (Coastal) Polygon -->
        <polygon points="40,240 180,220 240,290 140,360 40,340" fill="#fed7aa" fill-opacity="0.25" stroke="#f97316" stroke-dasharray="3,3" stroke-width="1"/>
        <!-- Zone 2 (North Arid) Polygon -->
        <polygon points="220,130 380,140 370,240 240,230" fill="#bae6fd" fill-opacity="0.25" stroke="#0ea5e9" stroke-dasharray="3,3" stroke-width="1"/>
        <!-- Zone 3 (Central Plains) Polygon -->
        <polygon points="190,220 380,220 440,340 210,340" fill="#bbf7d0" fill-opacity="0.25" stroke="#22c55e" stroke-dasharray="3,3" stroke-width="1"/>
        <!-- Zone 4 (Western Ghats) Polygon -->
        <polygon points="220,330 370,330 360,460 230,450" fill="#fecaca" fill-opacity="0.25" stroke="#ef4444" stroke-dasharray="3,3" stroke-width="1"/>

        <!-- Synoptic Mesh Network Connecting Lines -->
        <g class="mesh-lines" stroke="#cbd5e1" stroke-width="1" stroke-linecap="round">
          <line x1="80" y1="310" x2="120" y2="300" />
          <line x1="120" y1="300" x2="165" y2="290" />
          <line x1="165" y1="290" x2="200" y2="280" />
          <line x1="200" y1="280" x2="235" y2="250" />
          <line x1="235" y1="250" x2="260" y2="220" />
          <line x1="260" y1="220" x2="300" y2="200" />
          <line x1="300" y1="200" x2="340" y2="195" />
          <line x1="300" y1="200" x2="320" y2="270" />
          <line x1="320" y1="270" x2="375" y2="285" />
          <line x1="375" y1="285" x2="420" y2="300" />
          <line x1="200" y1="280" x2="220" y2="330" />
          <line x1="220" y1="330" x2="280" y2="350" stroke="#f87171" stroke-width="1.5" />
          <line x1="280" y1="350" x2="310" y2="380" stroke="#f87171" stroke-width="1.5" />
          <line x1="310" y1="380" x2="335" y2="410" />
          <line x1="320" y1="270" x2="280" y2="350" stroke="#f87171" stroke-width="1.2" stroke-dasharray="2,2"/>
        </g>

        <!-- Station Nodes -->
        @for (station of mapStations; track station.id) {
          <g
            class="station-node"
            [class.node-crit]="station.isCrit"
            [class.node-alert]="station.status === 'Alert'"
            [class.node-watch]="station.status === 'Watch'"
            [class.node-normal]="station.status === 'Normal'"
            (click)="onStationClick(station)"
            [attr.title]="station.label + ' (' + station.zone + ' - ' + station.status + ')'"
          >
            <!-- Pulse Glow for Critical Station AWS_1042 -->
            @if (station.isCrit) {
              <circle [attr.cx]="station.x" [attr.cy]="station.y" r="18" fill="url(#critGlow)" class="crit-pulse" />
              <circle [attr.cx]="station.x" [attr.cy]="station.y" r="9" fill="#ef4444" fill-opacity="0.3" />
            }

            <!-- Node Dot -->
            <circle
              [attr.cx]="station.x"
              [attr.cy]="station.y"
              [attr.r]="station.isCrit ? 6 : 4.5"
              [attr.fill]="station.isCrit ? '#dc2626' : (station.status === 'Alert' ? '#ea580c' : (station.status === 'Watch' ? '#d97706' : '#0284c7'))"
              stroke="#ffffff"
              stroke-width="1.5"
            />

            <!-- Node Label with high-contrast text -->
            <text
              [attr.x]="station.x + (station.x > 300 ? -8 : 8)"
              [attr.y]="station.y + (station.y > 300 ? 12 : -6)"
              [attr.text-anchor]="station.x > 300 ? 'end' : 'start'"
              class="node-text"
              [class.text-crit]="station.isCrit"
            >
              {{ station.label }}
            </text>
          </g>
        }
      </svg>
    </div>

    <div class="map-footer-meta">
      PROJ: WGS84 / UTM 43N • RES: 0.05° SYNOPTIC
    </div>
  </div>
</div>
