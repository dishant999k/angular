<div class="dashboard-page">
  <!-- Top Operational Header Bar -->
  <app-header />

  <!-- Search Stations Bar -->
  <div class="search-bar-container">
    <div class="search-input-wrapper">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input
        type="text"
        class="search-input"
        placeholder="Search stations by ID, zone, or status..."
        [(ngModel)]="searchQuery"
        (ngModelChange)="onSearchChange($event)"
      />
      @if (searchQuery) {
        <button type="button" class="clear-search-btn" (click)="searchQuery = ''; onSearchChange('')">
          ✕
        </button>
      }
    </div>
  </div>

  <!-- Main Content 2-Column Grid -->
  <div class="dashboard-grid">
    <!-- Left: Regional Sensor Density & Anomaly Map -->
    <section class="grid-left-col">
      <app-anomaly-map />
    </section>

    <!-- Right: Station Directory & Live Telemetry -->
    <section class="grid-right-col">
      <app-station-directory />
    </section>
  </div>
</div>
